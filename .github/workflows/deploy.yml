name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to FP Cloud (OIDC, no stored keys)
        uses: fogpipe/cloud-actions/auth@v1
        with:
          service-account: deployer@demo.yqw.cloud.fogpipe.com

      - name: Install fpcloud
        uses: fogpipe/cloud-actions/setup@v1

      - name: Stamp commit and time
        run: sed -i "s/__COMMIT__/${GITHUB_SHA::7}/; s/__DEPLOYED_AT__/$(date -u +%FT%TZ)/" public/index.html

      - name: Deploy
        uses: fogpipe/cloud-actions/website@v1
        with:
          project: demo
          name: site
          dir: public

      - name: Summary
        run: |
          url="$(fpcloud --project demo website show site -o json | jq -r .url)"
          echo "Deployed [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}) to ${url}" >> "$GITHUB_STEP_SUMMARY"
