name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to FP Cloud (OIDC, no stored keys)
        uses: fogpipe/cloud-actions/auth@v1
        with:
          service-account: deployer@demo.yqw.cloud.fogpipe.com

      - name: Install fpcloud
        run: |
          curl -fsSL https://raw.githubusercontent.com/fogpipe/cloud-cli/main/install.sh \
            | FPCLOUD_VERSION=v0.206.0 FPCLOUD_INSTALL_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Stamp commit and time
        run: sed -i "s/__COMMIT__/${GITHUB_SHA::7}/; s/__DEPLOYED_AT__/$(date -u +%FT%TZ)/" public/index.html

      - name: Deploy
        run: fpcloud website deploy site ./public --project demo
